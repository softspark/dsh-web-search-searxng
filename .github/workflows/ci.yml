name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static, build, and repository gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run package:check

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:coverage

  compatibility:
    name: DSH 0.1.1-rc.2 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm install --global npm@11.13.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Select older supported host seams without changing the lockfile
        run: npm install --no-save --package-lock=false --ignore-scripts @deepseek-ai/dsh-web@0.1.1-rc.2
      - run: npm run typecheck
      - run: npm test

  security:
    name: Dependency and source audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run audit:dependencies
      - run: npm run audit:signatures
      - run: npm run audit
      - name: Generate SARIF
        run: node scripts/audit.mjs --sarif > audit.sarif
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dsh-web-search-searxng-audit-sarif
          path: audit.sarif
      # Code Scanning ingestion needs Advanced Security, which is free on a
      # public repository and a paid licence on a private one; without it the
      # upload fails with "Resource not accessible by integration". The SARIF is
      # still generated and kept as an artefact either way, so the audit gate
      # keeps its teeth while the repository is private.
      - uses: github/codeql-action/upload-sarif@v4
        if: >-
          github.event.repository.visibility == 'public'
          && (github.event_name == 'push'
              || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: audit.sarif
